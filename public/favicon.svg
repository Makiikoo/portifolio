<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de cor hacker (neon ciano para verde digital) -->
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" />
      <stop offset="100%" stop-color="#39ff14" />
    </linearGradient>
    
    <linearGradient id="lightningGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#00aa55" />
    </linearGradient>
    
    <!-- Efeito de brilho neon -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo escuro (estilo terminal/hacker) -->
  <rect width="512" height="512" rx="110" fill="#0b0f19" />
  
  <!-- Detalhes de grade cibernética no fundo -->
  <path d="M50 100 H462 M50 200 H462 M50 300 H462 M50 400 H462" stroke="#13222e" stroke-width="2" stroke-dasharray="10 10" />
  <path d="M100 50 V462 M200 50 V462 M300 50 V462 M400 50 V462" stroke="#13222e" stroke-width="2" stroke-dasharray="10 10" />

  <!-- Colchetes de código nas bordas ([ ]) -->
  <path d="M 90 140 H 70 V 220 H 55 V 292 H 70 V 372 H 90" fill="none" stroke="#00ffcc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
  <path d="M 422 140 H 442 V 220 H 457 V 292 H 442 V 372 H 422" fill="none" stroke="#00ffcc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />

  <!-- Grupo Principal com Efeito Neon -->
  <g filter="url(#neonGlow)">
    
    <!-- Letra J (Estilizada à Esquerda) -->
    <path d="M 180 160 H 220 V 300 C 220 340 190 370 145 370 C 110 370 85 345 85 320" fill="none" stroke="url(#cyberGradient)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Letra C (Estilizada à Direita) -->
    <path d="M 380 190 C 350 155 300 150 260 170 C 240 180 230 200 230 220 V 300 C 230 330 250 360 280 370 C 330 380 390 350 400 300" fill="none" stroke="url(#cyberGradient)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- O Raio Central (Cortando as letras ao meio, igual ao Vite/Tema Cyber) -->
    <polygon points="280,40 180,240 260,240 210,470 350,220 270,220" fill="url(#lightningGradient)" />
             
  </g>

  <!-- Código binário decorativo discreto no rodapé -->
  <text x="256" y="475" font-family="&#39;JetBrains Mono&#39;, monospace" font-size="14" fill="#00ffcc" text-anchor="middle" opacity="0.3">01001010 01000011</text>
</svg>